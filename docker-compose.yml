services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.dev
        ports: 
            - "3000:3000"
        env_file:
            - .env
        volumes:
            - /app/node_modules
            - .:/app
        depends_on:
            - db
    db:
        image: postgres:alpine
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - pgdata:/var/lib/postgresql

volumes:
    pgdata: